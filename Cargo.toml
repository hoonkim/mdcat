[package]
name = "mdcat"
version = "0.1.0"
edition = "2021"
description = "A terminal Markdown viewer for kitty (OSC 66 text sizing + graphics protocol)"
license = "MIT"
repository = "https://github.com/hoonkim/mdcat"
readme = "README.md"

[[bin]]
name = "mdcat"
path = "src/main.rs"

[dependencies]
pulldown-cmark = "0.13"
crossterm = "0.29"
syntect = "5.3"
image = "0.25"
ureq = "3.3"
unicode-width = "0.2"
base64 = "0.22"
